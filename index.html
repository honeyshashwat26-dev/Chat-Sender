<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #006699;
    }
    #status {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Send a Message</h2>
    <textarea id="messageInput" placeholder="Type your message here..."></textarea>
    <button onclick="sendMessage()">Send Message</button>
    <div id="status"></div>
  </div>

  <script>
    // Paste your Google Web App URL below
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk5VkFk41bqcdKHcn8QmXmkIsWMCkARzR2h5pFKwwjGd2PNy90DoT375BESDT1W91rXw/exec";

    async function sendMessage() {
      const messageText = document.getElementById("messageInput").value.trim();
      const statusDiv = document.getElementById("status");

      if (!messageText) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Please enter a message.";
        return;
      }

      statusDiv.style.color = "black";
      statusDiv.innerText = "Sending...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        statusDiv.style.color = "green";
        statusDiv.innerText = "Message sent successfully!";
        document.getElementById("messageInput").value = "";
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Failed to send message.";
      }
    }
  </script>

</body>
</html>
